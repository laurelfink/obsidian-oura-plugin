name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  PLUGIN_NAME: obsidian-oura-plugin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:version
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir "$PLUGIN_NAME"
          cp main.js manifest.json styles.css "$PLUGIN_NAME/"
          zip -r "$PLUGIN_NAME-$RELEASE_TAG.zip" "$PLUGIN_NAME"
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Oura Ring $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md \
            main.js manifest.json styles.css "$PLUGIN_NAME-$RELEASE_TAG.zip"
